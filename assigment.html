<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Project - Survey</title>
    <style> 
         

    </style>
</head>
<body>

    <h1 style="text-align: center;">Form Project - Survey</h1>
    <h2>Individual Project</h2>

    <form>
        


        <fieldset>
            <legend>Your Details</legend>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Your name"><br><br>

            <label for="major">Major:</label><br>
            <input type="text" id="major" name="major" placeholder="Your major"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="example@domain.com"><br><br>

            <label>Gender:</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label><br><br>

            <label for="grade">Grade:</label>
            <select id="grade" name="grade">
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
            </select>
        </fieldset>

        


        <fieldset>
            <legend>Semester Feedback</legend>

            <label for="feedback">How is your semester going?</label>
            <select id="feedback" name="feedback">
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Average">Average</option>
                <option value="Poor">Poor</option>
            </select>
            <br>
            <br>

            <label>Which subjects are challenging?</label>
            <br>
            <input type="checkbox" id="web" name="subject" value="Web">
            <label for="web">Web</label>
            <input type="checkbox" id="python" name="subject" value="Python">
            <label for="python">Python</label>
            <input type="checkbox" id="english" name="subject" value="English">
            <label for="english">English</label>
            <input type="checkbox" id="math" name="subject" value="Math">
            <label for="math">Math</label>
            <br>
            <br>

            <label>Favorite day of the week:</label>
            <br>
            <input type="radio" id="mon" name="day" value="Monday">
            <label for="mon">Monday</label>
            <input type="radio" id="tue" name="day" value="Tuesday">
            <label for="tue">Tuesday</label>
            <input type="radio" id="wed" name="day" value="Wednesday">
            <label for="wed">Wednesday</label>
            <input type="radio" id="thu" name="day" value="Thursday">
            <label for="thu">Thursday</label>
            <input type="radio" id="fri" name="day" value="Friday">
            <label for="fri">Friday</label>
            <br>
            <br>

            <label for="comments">Additional Comments:</label>
            <br>
            <textarea id="comments" name="comments" rows="4" placeholder="Your feedback..."></textarea>
        </fieldset>

        <input type="submit" value="Submit Survey">
    </form>

</body>
</html>
